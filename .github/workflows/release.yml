name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Developer ID 签名并公证（需要先配置 Secrets）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NOTARIZE: ${{ github.event_name == 'push' || inputs.notarize }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "v$(cat VERSION)"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Prepare signing and notarization
        if: env.NOTARIZE == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name"; exit 1; }
          done
          CERT="$RUNNER_TEMP/noto.p12"
          KEYCHAIN="$RUNNER_TEMP/noto-signing.keychain-db"
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials noto-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=noto-release" >> "$GITHUB_ENV"
          echo "REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
      - name: Build DMG and verify CLI
        run: |
          zsh scripts/package.sh
          python3 scripts/verify-cli.py
      - uses: actions/upload-artifact@v4
        with:
          name: Noto-macOS-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/noto-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/noto-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/noto.p12"
  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Noto $RELEASE_TAG" --generate-notes
